<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --surface-2:#EFEBE2;
    --ink:#1C2333;
    --ink-soft:#5B6478;
    --line:#DEDAD0;
    --brand:#1F3A5F;
    --brand-2:#2C5282;
    --amber:#C77D2E;
    --amber-soft:#F3E3CE;
    --green:#2F7A5C;
    --green-soft:#DCEDE3;
    --red:#B4483C;
    --red-soft:#F5DFDA;
    --focus:#2C5282;
  }
  :root[data-theme="dark"]{
    --bg:#12151C;
    --surface:#1A1F29;
    --surface-2:#222835;
    --ink:#EDEEF2;
    --ink-soft:#9AA3B5;
    --line:#2E3444;
    --brand:#7FA8D9;
    --brand-2:#9EC0EA;
    --amber:#E3A75E;
    --amber-soft:#3A2E1C;
    --green:#6FBF9A;
    --green-soft:#1E332A;
    --red:#E08B7F;
    --red-soft:#3A2422;
    --focus:#9EC0EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:'Source Serif 4', serif; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  ::-webkit-scrollbar{ width:0; height:0; }

  #root{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; background:var(--bg); }

  .screen{ padding:20px 18px 96px; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brandmark{ display:flex; align-items:center; gap:9px; }
  .brandmark .mark{
    width:30px; height:30px; border-radius:8px; background:var(--brand);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;
  }
  .brandmark span{ font-size:17px; font-weight:700; letter-spacing:-0.01em; }
  .iconbtn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:15px;
  }

  .greeting{ font-size:22px; font-weight:600; margin:2px 0 2px; }
  .subgreeting{ color:var(--ink-soft); font-size:14px; margin:0 0 18px; }

  .stat-row{ display:flex; gap:10px; margin-bottom:20px; }
  .stat-card{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 12px; text-align:left;
  }
  .stat-num{ font-size:20px; font-weight:700; font-family:'Source Serif 4',serif; }
  .stat-label{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px;
  }
  .section-title{ font-size:16px; font-weight:700; }
  .section-link{ font-size:12.5px; color:var(--brand-2); font-weight:600; background:none; border:none; padding:0; }

  .quick-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .quick-btn{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 12px; text-align:left; display:flex; flex-direction:column; gap:6px;
  }
  .quick-btn .qicon{ font-size:18px; }
  .quick-btn .qlabel{ font-size:13.5px; font-weight:600; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:12px; position:relative; text-align:left; width:100%;
  }
  .card-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .card-title{ font-size:15px; font-weight:700; line-height:1.35; margin:0; }
  .card-provider{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .amount-badge{
    background:var(--green-soft); color:var(--green); font-weight:700; font-size:13px;
    padding:5px 10px; border-radius:9px; white-space:nowrap; flex-shrink:0;
  }
  .card-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .pill{
    font-size:11px; padding:3.5px 8px; border-radius:20px; border:1px solid var(--line);
    color:var(--ink-soft); background:var(--surface-2);
  }
  .pill.deadline{ border-color:transparent; }
  .pill.deadline.soon{ background:var(--red-soft); color:var(--red); }
  .pill.deadline.ok{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.verified{ background:var(--green-soft); color:var(--green); }
  .pill.unverified{ background:var(--amber-soft); color:var(--amber); }

  .match-row{ display:flex; align-items:center; gap:8px; margin-top:11px; }
  .match-track{ flex:1; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .match-fill{ height:100%; background:var(--brand-2); border-radius:4px; }
  .match-text{ font-size:11.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }

  .card-actions{ display:flex; gap:8px; margin-top:13px; }
  .btn{
    border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); flex:1; text-align:center;
  }
  .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.ghost{ background:transparent; }
  .btn.small{ flex:none; padding:8px 12px; }
  .btn.full{ width:100%; }
  .save-toggle{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }

  .search-bar{
    display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin-bottom:12px;
  }
  .search-bar input{
    border:none; background:none; outline:none; font-size:14px; flex:1; color:var(--ink); font-family:inherit;
  }
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .filter-chip{
    flex-shrink:0; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:20px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); white-space:nowrap;
  }
  .filter-chip.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .sort-select{
    font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--surface);
    border-radius:20px; padding:7px 12px; color:var(--ink); margin-bottom:14px;
  }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:var(--surface); border-top:1px solid var(--line); display:flex;
    padding:8px 6px 12px; z-index:40;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
    color:var(--ink-soft); font-size:10.5px; font-weight:600; padding:6px 0;
  }
  .nav-btn.active{ color:var(--brand-2); }
  .nav-btn .nicon{ font-size:18px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,12,18,0.55); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--bg); width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:0 0 28px; animation:slideUp .28s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:none; opacity:1;} }
  .modal-header{
    display:flex; justify-content:space-between; align-items:center; padding:16px 18px 6px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .modal-body{ padding:4px 18px 0; }

  .detail-hero{ padding:6px 0 14px; }
  .detail-amount{ font-size:26px; font-weight:700; font-family:'Source Serif 4',serif; color:var(--green); }
  .detail-title{ font-size:19px; font-weight:700; margin:6px 0 2px; line-height:1.3; }
  .detail-provider{ color:var(--ink-soft); font-size:13.5px; }

  .info-block{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .info-block h4{ font-size:12.5px; text-transform:none; color:var(--ink-soft); margin:0 0 8px; font-weight:600; }
  .info-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-top:1px solid var(--line); }
  .info-row:first-of-type{ border-top:none; }
  .info-row .k{ color:var(--ink-soft); }
  .info-row .v{ font-weight:600; text-align:right; max-width:60%; }

  .check-item{
    display:flex; align-items:center; justify-content:space-between; padding:10px 0;
    border-top:1px solid var(--line); font-size:13.5px;
  }
  .check-item:first-of-type{ border-top:none; }
  .check-status{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-soft);
  }
  .check-status.have{ background:var(--green-soft); color:var(--green); border-color:transparent; }
  .check-status.need{ background:var(--amber-soft); color:var(--amber); border-color:transparent; }

  .match-detail-row{ display:flex; align-items:flex-start; gap:9px; padding:8px 0; font-size:13.5px; border-top:1px solid var(--line); }
  .match-detail-row:first-of-type{ border-top:none; }
  .tick{ flex-shrink:0; }
  .tick.ok{ color:var(--green); }
  .tick.warn{ color:var(--amber); }

  .note-banner{
    background:var(--surface-2); border-radius:12px; padding:11px 13px; font-size:12.5px; color:var(--ink-soft);
    margin-top:12px; line-height:1.5;
  }

  .form-group{ margin-bottom:16px; }
  .form-label{ font-size:13px; font-weight:600; margin-bottom:6px; display:block; }
  .form-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .form-input, .form-select{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit;
  }
  .choice-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .choice-chip{
    padding:8px 13px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
    font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .choice-chip.active{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .onboard-wrap{ padding:24px 20px 28px; min-height:100vh; display:flex; flex-direction:column; }
  .progress-dots{ display:flex; gap:6px; margin-bottom:26px; }
  .progress-dots .dot{ height:4px; flex:1; border-radius:3px; background:var(--surface-2); }
  .progress-dots .dot.done{ background:var(--brand-2); }
  .onboard-step-title{ font-size:21px; font-weight:700; margin:0 0 6px; }
  .onboard-step-sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; }
  .onboard-footer{ margin-top:auto; display:flex; gap:10px; padding-top:16px; }

  .status-tabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
  .track-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .track-top{ display:flex; justify-content:space-between; gap:10px; }
  .status-badge{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .status-select{
    margin-top:10px; width:100%; font-size:12.5px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-family:inherit; font-weight:600;
  }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .eicon{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; margin:0; }

  .sponsored-tag{ font-size:10px; font-weight:700; color:var(--amber); background:var(--amber-soft); padding:2px 7px; border-radius:6px; margin-left:6px; }

  .theme-toggle{ font-size:15px; }

  .disclaimer-strip{
    font-size:11px; color:var(--ink-soft); text-align:center; padding:10px 20px 4px; line-height:1.5;
  }
</style>

/* ---------- Helpers ---------- */

function esc(str){
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, function(c){
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
  });
}
function byId(sId){ return SCHOLARSHIPS.filter(function(s){ return s.id === sId; })[0]; }
function daysUntil(dateStr){
  if (dateStr === "TBD") return 9999;
  var d = new Date(dateStr + "T00:00:00");
  var now = new Date("2026-09-18T00:00:00");
  return Math.round((d - now) / 86400000);
}
function fmtDate(dateStr){
  if (dateStr === "TBD") return "Check official website";
  var d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
}
function matchScore(sch){
  var total = sch.eligibility.length;
  var met = sch.eligibility.filter(function(e){ return e.met === true; }).length;
  return { met: met, total: total, pct: Math.round((met/total)*100) };
}

/* ---------- Small render helpers ---------- */

function deadlinePillHtml(deadline){
  if (deadline === "TBD"){
    return '<span class="pill deadline ok">Check official website</span>';
  }
  var days = daysUntil(deadline);
  var soon = days <= 10;
  var label = days < 0 ? "Closed" : days === 0 ? "Closes today" : days === 1 ? "1 day left" : (days + " days left");
  return '<span class="pill deadline ' + (soon ? "soon" : "ok") + '">' + esc(label) + '</span>';
}
function verifiedPillHtml(verified){
  return verified
    ? '<span class="pill verified">\u2713 Verified</span>'
    : '<span class="pill unverified">\u26A0 Unverified</span>';
}
function scholarshipCardHtml(sch){
  var m = matchScore(sch);
  var saved = state.saved.indexOf(sch.id) !== -1;
  return (
    '<div class="card">' +
      '<button class="save-toggle" data-action="toggle-save" data-id="' + sch.id + '" aria-label="Toggle save">' + (saved ? "\u2605" : "\u2606") + '</button>' +
      '<div class="card-top"><div style="padding-right:34px">' +

      '<div class="card-top" style="margin-top:10px"><span class="amount-badge">' + esc(sch.amountLabel) + '</span></div>' +
      '<div class="card-meta">' +
        deadlinePillHtml(sch.deadline) +

/* ---------- Screens ---------- */

function activeMatches(){
  return SCHOLARSHIPS.filter(function(s){ return daysUntil(s.deadline) >= 0; })
    .slice()
    .sort(function(a,b){ return matchScore(b).pct - matchScore(a).pct; });
}

function renderHome(){
  var matches = activeMatches();
  var closingSoon = matches.filter(function(s){ var d = daysUntil(s.deadline); return d <= 10 && d >= 0; }).length;
  var applied = 0, underReview = 0;
  Object.keys(state.appStatus).forEach(function(k){
    if (state.appStatus[k] === "Applied") applied++;
    if (state.appStatus[k] === "Under Review") underReview++;
  });
  var name = state.profile && state.profile.name ? ", " + esc(state.profile.name) : "";

  var topCards = matches.slice(0,3).map(scholarshipCardHtml).join("");

  return (
    '<div class="screen">' +
      '<div class="greeting">Good morning' + name + ' \uD83D\uDC4B</div>' +
      '<p class="subgreeting">' + matches.length + ' scholarships may match your profile.</p>' +
      '<div class="stat-row">' +
        '<div class="stat-card"><div class="stat-num" style="color:var(--red)">' + closingSoon + '</div><div class="stat-label">closing within 10 days</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + applied + '</div><div class="stat-label">applications submitted</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + underReview + '</div><div class="stat-label">under review</div></div>' +

      topCards +

  );
}

function filteredSearchResults(){
  var s = state.search;
  var list = SCHOLARSHIPS.filter(function(sch){ return daysUntil(sch.deadline) >= 0; });
  if (s.q.trim()){
    var t = s.q.toLowerCase();
    list = list.filter(function(sch){
      return sch.name.toLowerCase().indexOf(t) !== -1 ||
             sch.provider.toLowerCase().indexOf(t) !== -1 ||
             sch.course.toLowerCase().indexOf(t) !== -1;
    });
  }
  if (s.cat !== "All"){
    list = list.filter(function(sch){
      return sch.type.toLowerCase().indexOf(s.cat.toLowerCase()) !== -1 || sch.course.toLowerCase() === s.cat.toLowerCase();
    });
  }
  if (s.onlyMatch){
    list = list.filter(function(sch){ return matchScore(sch).pct >= 70; });
  }
  list = list.slice();
  if (s.sort === "deadline") list.sort(function(a,b){ return daysUntil(a.deadline) - daysUntil(b.deadline); });
  if (s.sort === "amount") list.sort(function(a,b){ return b.amount - a.amount; });
  if (s.sort === "match") list.sort(function(a,b){ return matchScore(b).pct - matchScore(a).pct; });
  if (s.sort === "recent") list.sort(function(a,b){ return new Date(b.lastVerified) - new Date(a.lastVerified); });
  return list;
}

function renderResultsListOnly(){
  var container = document.getElementById("search-results");
  if (!container) return;
  var list = filteredSearchResults();
  container.innerHTML = list.length === 0
    ? emptyStateHtml("\uD83D\uDDC2\uFE0F", "No scholarships match those filters yet.<br>Try clearing a filter or a different keyword.")
    : list.map(scholarshipCardHtml).join("");
}

      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:2px">' +
        '<select class="sort-select" id="sort-select">' + sortOptions + '</select>' +
        '<button class="filter-chip ' + (s.onlyMatch ? "active" : "") + '" data-action="toggle-only-match">Strong matches only</button>' +

    '<div class="screen">' +
      '<h2 class="onboard-step-title" style="font-size:20px;margin-bottom:14px">Profile</h2>' +
      '<div class="info-block"><h4>Your details</h4>' +
        '<div class="info-row"><span class="k">Name</span><span class="v">' + esc(p.name || "\u2014") + '</span></div>' +
        '<div class="info-row"><span class="k">State</span><span class="v">' + esc(p.state || "\u2014") + '</span></div>' +
        '<div class="info-row"><span class="k">Level</span><span class="v">' + esc(p.level || "\u2014") + '</span></div>' +
        '<div class="info-row"><span class="k">Course</span><span class="v">' + esc(p.course || "\u2014") + '</span></div>' +
        '<div class="info-row"><span class="k">CGPA / %</span><span class="v">' + esc(p.cgpa || "\u2014") + '</span></div>' +
        '<div class="info-row"><span class="k">Income range</span><span class="v">' + esc(p.income || "Not shared") + '</span></div>' +
        '<button class="btn full" style="margin-top:12px" data-action="edit-profile">Edit profile</button>' +
      '</div>' +
      '<div class="info-block"><h4>Preferences</h4><div class="choice-grid">' + prefsHtml + '</div></div>' +
      '<div class="info-block"><h4>App settings</h4>' +
        '<div class="info-row"><span class="k">Appearance</span><span class="v"><button class="btn small" data-action="toggle-theme">' + (state.theme === "light" ? "\u2600\uFE0F Light" : "\uD83C\uDF19 Dark") + '</button></span></div>' +
        '<div class="info-row"><span class="k">Deadline reminders</span><span class="v"><button class="btn small" data-action="toggle-notif">' + (state.notifOn ? "On" : "Off") + '</button></span></div>' +
      '</div>' +
      '<div class="info-block"><h4>Plan</h4>' +
        '<div class="info-row"><span class="k">Current plan</span><span class="v">Free</span></div>' +
        '<div class="form-hint" style="margin-bottom:10px">Premium (\u20B949/mo) adds advanced filters and priority alerts. Core search, matching, saving and tracking always stay free.</div>' +
        '<button class="btn primary full">See Premium</button>' +
      '</div>' +
      '<div class="disclaimer-strip">ScholarTrack surfaces scholarship information for discovery only. Always confirm details on the official provider page before applying. No scholarship is guaranteed.</div>' +
    '</div>'
  );
}

/* ---------- Shell + render orchestration ---------- */

function renderShell(){
  var navItems = [
    ["home","\u2302","Home"],
    ["search","\uD83D\uDD0D","Search"],
    ["saved","\u2605","Saved"],
    ["tracker","\uD83D\uDCCB","Applications"],
    ["profile","\uD83D\uDC64","Profile"]
  ];
  var navHtml = navItems.map(function(n){
    return '<button class="nav-btn ' + (state.tab === n[0] ? "active" : "") + '" data-action="goto" data-value="' + n[0] + '">' +
      '<span class="nicon">' + n[1] + '</span><span>' + n[2] + '</span></button>';
  }).join("");

  return (
    '<div class="topbar">' +
      '<div class="brandmark"><div class="mark">S</div><span>ScholarTrack</span></div>' +
      '<button class="iconbtn theme-toggle" data-action="toggle-theme" aria-label="Toggle theme">' + (state.theme === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F") + '</button>' +
    '</div>' +
    '<div id="screen-content"></div>' +
    '<div class="bottom-nav">' + navHtml + '</div>' +
    '<div id="modal-root"></div>'
  );
}

function renderScreenContent(){
  var el = document.getElementById("screen-content");
  if (!el) return;
  if (state.tab === "home") el.innerHTML = renderHome();
  else if (state.tab === "search") el.innerHTML = renderSearch();
  else if (state.tab === "saved") el.innerHTML = renderSaved();
  else if (state.tab === "tracker") el.innerHTML = renderTracker();
  else if (state.tab === "profile") el.innerHTML = renderProfile();
}

function renderModalRoot(){
  var el = document.getElementById("modal-root");
  if (!el) return;
  el.innerHTML = state.openSchId ? renderModal() : "";
}

function render(){
  document.documentElement.setAttribute("data-theme", state.theme);
  var root = document.getElementById("root");
  if (!state.onboarded){
    root.innerHTML = renderOnboarding();
    return;
  }
  root.innerHTML = renderShell();
  renderScreenContent();
  renderModalRoot();
}

/* ---------- Event delegation ---------- */

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-action]") : null;
  if (!t) return;
  var action = t.getAttribute("data-action");
  var id = t.getAttribute("data-id");
  var value = t.getAttribute("data-value");

  if (action === "ob-next"){
    readOnboardInputs();
    state.step = Math.min(state.step + 1, ONBOARD_STEPS.length - 1);
    render();
  } else if (action === "ob-back"){
    readOnboardInputs();
    state.step = Math.max(state.step - 1, 0);
    render();
  } else if (action === "ob-finish"){
    readOnboardInputs();
    state.profile = JSON.parse(JSON.stringify(state.formData));
    state.onboarded = true;
    render();
  } else if (action === "ob-set-level"){
    state.formData.level = value;
    render();
  } else if (action === "ob-toggle-pref"){
    var idx = state.formData.prefs.indexOf(value);
    if (idx === -1) state.formData.prefs.push(value); else state.formData.prefs.splice(idx, 1);
    render();
  } else if (action === "goto"){
    state.tab = value;
    render();
  } else if (action === "toggle-theme"){
    state.theme = state.theme === "light" ? "dark" : "light";
    render();
  } else if (action === "toggle-notif"){
    state.notifOn = !state.notifOn;
    render();
  } else if (action === "edit-profile"){
    state.onboarded = false;
    state.step = 0;
    render();
  } else if (action === "toggle-save"){
    var i = state.saved.indexOf(id);
    if (i === -1) state.saved.push(id); else state.saved.splice(i, 1);
    render();
  } else if (action === "open-sch"){
    state.openSchId = id;
    renderModalRoot();
  } else if (action === "close-modal"){
    state.openSchId = null;
    renderModalRoot();
  } else if (action === "toggle-doc"){
    var doc = t.getAttribute("data-doc");
    if (!state.docStatus[id]) state.docStatus[id] = {};
    state.docStatus[id][doc] = state.docStatus[id][doc] === "have" ? "need" : "have";
    renderModalRoot();
  } else if (action === "set-cat"){
    state.search.cat = value;
    render();
  } else if (action === "toggle-only-match"){
    state.search.onlyMatch = !state.search.onlyMatch;
    render();
  } else if (action === "set-tracker-filter"){
    trackerFilter = value;
    render();
  }
});

document.addEventListener("input", function(e){
  if (e.target.id === "search-input"){
    state.search.q = e.target.value;
    renderResultsListOnly();
  }
});

document.addEventListener("change", function(e){
  if (e.target.id === "sort-select"){
    state.search.sort = e.target.value;
    renderResultsListOnly();
  } else if (e.target.getAttribute && e.target.getAttribute("data-action") === "set-status"){
    var id = e.target.getAttribute("data-id");
    state.appStatus[id] = e.target.value;
    if (state.tab === "tracker") renderScreenContent();
  }
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* ignore in sandboxed preview */ });
  });
}
</script>
